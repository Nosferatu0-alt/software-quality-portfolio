name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Rodar os testes do Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: cypress-saucedemo
          browser: chrome

      - name: Guardar screenshots se algo falhar
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress-saucedemo/cypress/screenshots
